
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler

            logout:
                path: app_logout
                target: app_login

    
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Admin-only pages
        - { path: ^/register$, roles: ROLE_ADMIN }
        - { path: ^/admin/staff(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/admin/dashboard$, roles: ROLE_ADMIN }

        # Shared Admin and Staff management pages
        - { path: ^/admin/bookings(?:/|$), roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/admin/motorcycles(?:/|$), roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/customer(?:/|$), roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/payment(?:/|$), roles: [ROLE_ADMIN, ROLE_STAFF] }

        # All other Admin pages remain Admin-only
        - { path: ^/admin(?:/|$), roles: ROLE_ADMIN }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
